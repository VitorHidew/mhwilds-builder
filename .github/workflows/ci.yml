name: Testes e build

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
      - name: Instalar dependências
        run: python -m pip install -r requirements-dev.txt
      - name: Verificar sintaxe Python
        run: python -m compileall -q app tests
      - name: Verificar sintaxe JavaScript
        run: |
          node --check static/js/app.js
          node --check static/js/planner.js
          node --check static/js/material-plan.js
      - name: Testar estado do frontend e materiais
        run: node --test tests/material-plan.test.js tests/planner-state.test.js
      - name: Executar testes
        run: python -m pytest -q -p no:cacheprovider

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Construir imagem de produção
        run: docker build --tag mhwilds-builder:ci .

